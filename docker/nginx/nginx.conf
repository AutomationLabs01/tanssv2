# =============================================================================
# Nginx – Reverse Proxy + TLS-Termination + Security-Headers
# Einziger öffentlich exponierter Service im Stack
# =============================================================================

user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;

# Fehler-Logging auf stderr (→ Docker json-file driver)
error_log  /dev/stderr warn;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging – kein sensitiver Content
    # -------------------------------------------------------------------------
    log_format main_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$uri",'           # Kein $request (enthält Query-String mit API-Keys!)
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /dev/stdout main_json;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  75s;
    keepalive_requests 1000;
    server_tokens   off;    # Nginx-Version nicht in Headers exponieren

    # Gzip für API-Responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones (zusätzlich zu Kong)
    # -------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr  zone=api:10m   rate=60r/m;
    limit_req_zone  $binary_remote_addr  zone=auth:10m  rate=10r/m;
    limit_req_zone  $binary_remote_addr  zone=n8n:10m   rate=30r/m;
    limit_conn_zone $binary_remote_addr  zone=conn:10m;

    # -------------------------------------------------------------------------
    # Upstream-Definitionen
    # -------------------------------------------------------------------------
    upstream supabase_api {
        server kong:8000;
        keepalive 32;
    }

    upstream n8n_app {
        server n8n:5678;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # HTTP → HTTPS Redirect (HSTS vorbereiten)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME Challenge (falls Certbot eingesetzt wird)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Alles andere → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # Supabase API – HTTPS (Port 443 / /api/*)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2  on;
        server_name ${DOMAIN:-localhost};

        # TLS-Konfiguration
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (nur mit echten Zertifikaten, nicht self-signed)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # -----------------------------------------------------------------------
        # Security-Headers (OWASP-Empfehlungen)
        # -----------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                                          always;
        add_header X-Content-Type-Options    "nosniff"                                       always;
        add_header X-XSS-Protection          "1; mode=block"                                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"      always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://${DOMAIN:-localhost};"
            always;

        # Server-Version verstecken
        server_tokens off;
        more_clear_headers Server;

        # Max. Request-Größe (übereinstimmend mit Kong)
        client_max_body_size 50M;

        # -----------------------------------------------------------------------
        # Verbindungslimits
        # -----------------------------------------------------------------------
        limit_conn conn 20;

        # -----------------------------------------------------------------------
        # Supabase REST API
        # -----------------------------------------------------------------------
        location /rest/v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://supabase_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }

        # Supabase Auth
        location /auth/v1/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://supabase_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_http_version 1.1;
        }

        # Supabase Realtime (WebSocket)
        location /realtime/v1/ {
            proxy_pass         http://supabase_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;   # WebSocket: 24h Timeout
        }

        # Supabase Storage
        location /storage/v1/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://supabase_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_http_version 1.1;
            proxy_read_timeout 300s;     # Uploads können länger dauern
        }

        # -----------------------------------------------------------------------
        # n8n Webhook-Endpunkte (öffentlich erreichbar für externe Trigger)
        # -----------------------------------------------------------------------
        location /webhook/ {
            limit_req zone=n8n burst=10 nodelay;
            proxy_pass         http://n8n_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }

        # n8n UI + API – nur für autorisierte Netzwerke (IP-Whitelist optional)
        location /n8n/ {
            limit_req zone=n8n burst=20 nodelay;

            # Optional: IP-Whitelist für n8n-Admin
            # allow 192.168.1.0/24;
            # deny  all;

            proxy_pass         http://n8n_app/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_http_version 1.1;
        }

        # -----------------------------------------------------------------------
        # Gesperrte Pfade – kein öffentlicher Zugang
        # -----------------------------------------------------------------------
        location /pg/ {
            # Supabase Meta API – nur intern
            deny all;
            return 404;
        }

        location ~ /\. {
            # Versteckte Dateien (.env, .git, etc.) sperren
            deny all;
            return 404;
        }

        # -----------------------------------------------------------------------
        # Fallback: 404 für alles andere
        # -----------------------------------------------------------------------
        location / {
            return 404;
        }
    }
}
