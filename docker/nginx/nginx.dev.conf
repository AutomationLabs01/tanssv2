# Nginx Dev-Konfiguration – kein TLS, kein Rate Limiting
# Nur zusammen mit docker-compose.dev.yml verwenden!

user  nginx;
worker_processes 1;
pid   /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include      /etc/nginx/mime.types;
    access_log   /dev/stdout;
    server_tokens off;

    upstream supabase_api { server kong:8000; }
    upstream n8n_app      { server n8n:5678; }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        location /rest/v1/    { proxy_pass http://supabase_api; }
        location /auth/v1/    { proxy_pass http://supabase_api; }
        location /storage/v1/ { proxy_pass http://supabase_api; }
        location /realtime/v1/ {
            proxy_pass         http://supabase_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
        location /webhook/    { proxy_pass http://n8n_app; }
        location /n8n/        { proxy_pass http://n8n_app/; }
        location /            { return 404; }
    }
}
