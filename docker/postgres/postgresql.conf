# =============================================================================
# PostgreSQL 15/16 – Security-gehärtete Konfiguration
# Für: Supabase self-hosted + pgvector RAG Stack
# =============================================================================

# ---------------------------------------------------------------------------
# Verbindungen und Authentifizierung
# ---------------------------------------------------------------------------
listen_addresses = '*'          # Kong/PostgREST im Docker-Netz brauchen Zugang
max_connections = 200           # Hardlimit; PostgREST pool + Auth + n8n
superuser_reserved_connections = 3

# ---------------------------------------------------------------------------
# SSL – Pflicht für alle Verbindungen (außer lokal via Unix Socket)
# pg_hba.conf erzwingt SSL für TCP-Verbindungen
# ---------------------------------------------------------------------------
ssl = on
ssl_cert_file = '/var/lib/postgresql/server.crt'
ssl_key_file  = '/var/lib/postgresql/server.key'
ssl_min_protocol_version = 'TLSv1.2'
ssl_ciphers = 'HIGH:!aNULL:!MD5:!RC4:!3DES'
ssl_prefer_server_ciphers = on

# ---------------------------------------------------------------------------
# Speicher
# ---------------------------------------------------------------------------
shared_buffers = 512MB              # 25% des verfügbaren RAM (bei 2GB: 512MB)
effective_cache_size = 1536MB       # 75% des RAM
maintenance_work_mem = 128MB
work_mem = 16MB                     # Pro Sort/Hash-Operation
wal_buffers = 16MB
dynamic_shared_memory_type = posix

# ---------------------------------------------------------------------------
# Write-Ahead-Logging (WAL) / Durability
# ---------------------------------------------------------------------------
wal_level = logical                 # Für Supabase Realtime (Logical Replication)
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 256MB               # WAL für Replikations-Slots vorhalten
fsync = on                          # NIEMALS deaktivieren in Produktion!
synchronous_commit = on
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 512MB

# ---------------------------------------------------------------------------
# Query-Planer
# ---------------------------------------------------------------------------
random_page_cost = 1.1              # SSD: näher an 1.0
effective_io_concurrency = 200      # SSD: 200+
default_statistics_target = 100

# ---------------------------------------------------------------------------
# Logging – Security-relevant, keine sensitiven Daten
# ---------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off             # Docker: stderr → json-file driver
log_min_duration_statement = 1000  # Nur Queries > 1s loggen (Performance)
log_checkpoints = on
log_connections = on                # Login-Events loggen (Audit)
log_disconnections = on
log_duration = off                  # Kein Query-Timing-Spam
log_error_verbosity = default
log_hostname = off                  # Kein Reverse-DNS-Lookup (Performance + Privacy)
log_line_prefix = '%t [%p]: [%l-1] db=%d,user=%u,app=%a,client=%h '
log_lock_waits = on                 # Lock-Waits > deadlock_timeout loggen
log_temp_files = 64MB               # Temp-Files > 64MB loggen
log_autovacuum_min_duration = 500ms

# Keine Passwörter in Logs
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

# ---------------------------------------------------------------------------
# Sicherheit – Datenbank-Features
# ---------------------------------------------------------------------------
# Verhindert dass Funktionen lokale Dateien lesen/schreiben können
# (außer Superuser)
# local_preload_libraries = ''

# pg_stat_statements für Performance-Monitoring (optional)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all

# Passwort-Verschlüsselung – nur scram-sha-256 (kein md5!)
password_encryption = scram-sha-256

# ---------------------------------------------------------------------------
# Autovacuum – wichtig für HNSW-Index-Performance
# ---------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms

# ---------------------------------------------------------------------------
# HNSW-Index-spezifisch (pgvector)
# Für den angebote_vectors HNSW-Index bei Similarity Search
# ---------------------------------------------------------------------------
# ef_search während der Suche: mehr = genauer, langsamer
# Wird per Session gesetzt: SET hnsw.ef_search = 40;
# Default ist 40, in postgresql.conf kann man den Default überschreiben:
# hnsw.ef_search = 40  # Erfordert pgvector geladen

# ---------------------------------------------------------------------------
# Verbindungslimits per Rolle (zusätzlich zu pg_hba.conf)
# Wird in 01_roles.sql per ALTER ROLE ... CONNECTION LIMIT gesetzt
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Locale
# ---------------------------------------------------------------------------
lc_messages = 'de_DE.UTF-8'
lc_monetary = 'de_DE.UTF-8'
lc_numeric = 'de_DE.UTF-8'
lc_time = 'de_DE.UTF-8'
timezone = 'Europe/Berlin'

# ---------------------------------------------------------------------------
# Sonstiges
# ---------------------------------------------------------------------------
idle_in_transaction_session_timeout = 30s  # Hängende Transactions beenden
statement_timeout = 60s                     # Zu lange Queries abbrechen
lock_timeout = 10s                          # Lock-Timeouts (für Deadlock-Schutz)

# Verhindert sehr lange Queries die Ressourcen blockieren
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 10
