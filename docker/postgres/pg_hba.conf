# =============================================================================
# PostgreSQL pg_hba.conf – Client Authentication Configuration
# Security-gehärtet: scram-sha-256 only, SSL required for TCP
# =============================================================================
#
# Format:
#   TYPE  DATABASE  USER         ADDRESS          METHOD  [OPTIONS]
#
# TYPE:     local (Unix Socket), host (TCP+SSL), hostssl (SSL-only), hostnossl
# DATABASE: specific DB, all, sameuser, samerole, replication
# USER:     specific user, all, group (+groupname)
# ADDRESS:  IP/CIDR oder hostname
# METHOD:   scram-sha-256, reject, trust (NUR für lokalen superuser!)
#
# Reihenfolge: Erste passende Regel gewinnt
# =============================================================================

# ---------------------------------------------------------------------------
# Unix Domain Sockets (lokale Verbindungen im Container)
# Nur für pg_isready, initdb, Migrations – kein Passwort nötig
# ---------------------------------------------------------------------------
local   all             postgres                        trust
local   all             all                             scram-sha-256

# ---------------------------------------------------------------------------
# Replikation (Supabase Realtime braucht Logical Replication)
# ---------------------------------------------------------------------------
local   replication     postgres                        trust
hostssl replication     supabase_admin  172.20.2.0/24  scram-sha-256

# ---------------------------------------------------------------------------
# TCP-Verbindungen: NUR über SSL (hostssl), NUR aus Docker-Netz
# ---------------------------------------------------------------------------

# Supabase-Admin – nur aus internem DB-Netz (PostgREST, Auth, Meta, n8n)
hostssl all             supabase_admin  172.20.2.0/24  scram-sha-256

# PostgREST / Supabase Auth – Authenticator-Rolle
hostssl all             authenticator   172.20.1.0/24  scram-sha-256
hostssl all             authenticator   172.20.2.0/24  scram-sha-256

# n8n – eigener User, eigenes Schema
hostssl all             n8n_user        172.20.1.0/24  scram-sha-256
hostssl all             n8n_user        172.20.2.0/24  scram-sha-256

# Storage Admin
hostssl all             supabase_storage_admin 172.20.2.0/24 scram-sha-256

# Realtime
hostssl all             supabase_replication_admin 172.20.2.0/24 scram-sha-256

# ---------------------------------------------------------------------------
# DENY: Alles andere explizit ablehnen
# (Defensive: unnötige Verbindungen von außen blockieren)
# ---------------------------------------------------------------------------
host    all             all             0.0.0.0/0      reject
host    all             all             ::/0           reject
